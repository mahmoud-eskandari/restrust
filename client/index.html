<!DOCTYPE html>
<html>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=YES" />
<title>restrust</title>
<link data-trunk rel="rust" data-bin="restrust-client" data-wasm-opt="2" />
<link data-trunk rel="icon" href="assets/logo.png" type="image/png" />
<style>
    html {
        /* Remove touch delay */
        touch-action: manipulation;
    }

    body {
        /* Dark mode background */
        background: #121418;
        margin: 0;
        padding: 0;
        overflow: hidden;
    }

    /* The canvas fills the viewport. The WASM code resizes it dynamically. */
    canvas {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        height: 100%;
    }

    /* Simple loading spinner shown until the WASM boots (eframe_template). */
    .centered {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #9aa1ab;
        font-family: system-ui, sans-serif;
    }

    .lds-dual-ring {
        display: inline-block;
        width: 64px;
        height: 64px;
    }

    .lds-dual-ring:after {
        content: " ";
        display: block;
        width: 46px;
        height: 46px;
        margin: 1px;
        border-radius: 50%;
        border: 5px solid #30343b;
        border-color: #30343b transparent #30343b transparent;
        animation: lds-dual-ring 1.2s linear infinite;
    }

    @keyframes lds-dual-ring {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
</style>
</head>
<body>
    <canvas id="the_canvas_id"></canvas>
    <div class="centered" id="loading_text"><div class="lds-dual-ring"></div></div>

    <!-- Powered by egui: https://github.com/emilk/egui -->
</body>
</html>
