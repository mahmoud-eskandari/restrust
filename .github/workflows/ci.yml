name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Format, lint, and workflow validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: quality
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: actionlint@1.7.12
      - name: Validate workflows
        run: actionlint
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: python scripts/ci/run.py cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test release tooling
        run: python -m unittest discover -s scripts/ci -p 'test_*.py' -v

  native:
    name: Test and release (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ${{ matrix.target }}
      - name: Install target
        run: rustup target add '${{ matrix.target }}'
      - name: Test workspace
        run: python scripts/ci/run.py cargo test --locked --workspace --target '${{ matrix.target }}'
      - name: Build desktop and server release binaries
        run: python scripts/ci/run.py cargo build --locked --release --workspace --bins --target '${{ matrix.target }}'
      - name: Package and smoke-test release
        run: python scripts/ci/package_release.py --target '${{ matrix.target }}'
      - name: Upload release archive and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  web:
    name: Browser release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: wasm32-unknown-unknown
      - name: Install WASM target
        run: rustup target add wasm32-unknown-unknown
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: trunk@0.22.0
      - name: Check WASM client
        run: python scripts/ci/run.py cargo check --locked -p restrust-client --target wasm32-unknown-unknown
      - name: Build browser release
        working-directory: client
        run: python ../scripts/ci/run.py trunk build --release --locked
      - name: Package browser release
        run: python scripts/ci/package_release.py --web
      - name: Upload browser archive and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-web
          path: dist/*
          if-no-files-found: error
          compression-level: 0
